<svg viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" width="800" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#38bdf8;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#818cf8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      /* Flowing line animation */
      .flow-line {
        stroke-dasharray: 300 600;
        stroke-dashoffset: 900;
        animation: flowLine 3s linear infinite;
      }
      @keyframes flowLine {
        to { stroke-dashoffset: 0; }
      }

      /* Dot pulse animations — staggered */
      .dot { animation: dotPulse 2s ease-in-out infinite; }
      .d1 { animation-delay: 0s; }
      .d2 { animation-delay: 0.3s; }
      .d3 { animation-delay: 0.6s; }
      .d4 { animation-delay: 0.9s; }
      .d5 { animation-delay: 1.2s; }
      @keyframes dotPulse {
        0%, 100% { r: 5; opacity: 0.4; }
        50%       { r: 9; opacity: 1; }
      }

      /* Ring pulse around center dot */
      .ring {
        fill: none;
        stroke: #818cf8;
        stroke-width: 1.5;
        animation: ringPulse 2s ease-out infinite;
        animation-delay: 0.6s;
        transform-origin: 400px 80px;
      }
      @keyframes ringPulse {
        0%   { r: 12; opacity: 0.8; }
        100% { r: 32; opacity: 0; }
      }

      /* Title fade-slide in */
      .title-main {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 28px;
        fill: #f1f5f9;
        animation: slideIn 0.8s ease-out forwards;
        opacity: 0;
      }
      .title-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        fill: #94a3b8;
        animation: slideIn 0.8s ease-out 0.3s forwards;
        opacity: 0;
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Badge pills */
      .badge-pill {
        animation: badgeFade 0.6s ease-out forwards;
        opacity: 0;
      }
      .bp1 { animation-delay: 0.6s; }
      .bp2 { animation-delay: 0.8s; }
      .bp3 { animation-delay: 1.0s; }
      @keyframes badgeFade {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Orbit dots */
      .orbit-dot {
        fill: #38bdf8;
        animation: orbit 4s linear infinite;
        transform-origin: 400px 80px;
      }
      @keyframes orbit {
        from { transform: rotate(0deg) translateX(42px) rotate(0deg); }
        to   { transform: rotate(360deg) translateX(42px) rotate(-360deg); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" rx="14" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="40"  x2="800" y2="40"  stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="80"  x2="800" y2="80"  stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#1e293b" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="160" stroke="#1e293b" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="160" stroke="#1e293b" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="160" stroke="#1e293b" stroke-width="1"/>

  <!-- Flowing animated line -->
  <path d="M 0 80 Q 100 30 200 80 Q 300 130 400 80 Q 500 30 600 80 Q 700 130 800 80"
        stroke="url(#lineGrad)" stroke-width="2" fill="none"
        class="flow-line" filter="url(#glow)"/>

  <!-- Animated dots along the wave -->
  <circle cx="100" cy="53"  class="dot d1" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="200" cy="80"  class="dot d2" fill="#0ea5e9" filter="url(#glow)"/>
  <circle cx="400" cy="80"  class="dot d3" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="600" cy="80"  class="dot d4" fill="#0ea5e9" filter="url(#glow)"/>
  <circle cx="700" cy="107" class="dot d5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Pulsing ring around center dot -->
  <circle cx="400" cy="80" class="ring"/>

  <!-- Orbiting tiny dot -->
  <circle cx="442" cy="80" r="3" class="orbit-dot" filter="url(#glow)"/>

  <!-- Main title -->
  <text x="400" y="65" text-anchor="middle" class="title-main">
    🎬 @lottiefiles/dotlottie-web
  </text>

  <!-- Subtitle -->
  <text x="400" y="90" text-anchor="middle" class="title-sub">
    High-performance Lottie &amp; dotLottie animation player · Powered by WebAssembly
  </text>

  <!-- Badge pills -->
  <g class="badge-pill bp1">
    <rect x="220" y="108" width="80" height="22" rx="11" fill="#0ea5e920" stroke="#0ea5e9" stroke-width="1"/>
    <text x="260" y="123" text-anchor="middle" font-size="10" fill="#38bdf8" font-family="monospace">WebAssembly</text>
  </g>
  <g class="badge-pill bp2">
    <rect x="312" y="108" width="60" height="22" rx="11" fill="#8b5cf620" stroke="#8b5cf6" stroke-width="1"/>
    <text x="342" y="123" text-anchor="middle" font-size="10" fill="#a78bfa" font-family="monospace">TypeScript</text>
  </g>
  <g class="badge-pill bp3">
    <rect x="384" y="108" width="70" height="22" rx="11" fill="#10b98120" stroke="#10b981" stroke-width="1"/>
    <text x="419" y="123" text-anchor="middle" font-size="10" fill="#34d399" font-family="monospace">MIT License</text>
  </g>
</svg>
